<div class="upload-root">
  <input #fileInput type="file" accept="application/json,.json"
         (change)="onFileChange($event)" hidden />

  <!-- gombok -->
  <div class="upload-actions">
    <button class="hbtn primary" (click)="onPickFileClick(fileInput)">
      ↑ Upload trace
    </button>
    <button class="hbtn" (click)="openCloudList()" title="Load from cloud">
      ☁ Cloud
    </button>
  </div>

  <!-- betöltött fájl jelzése -->
  <div class="file-chip" *ngIf="fileName && !error">
    <span class="chip-name" [title]="fileName">{{ fileName }}</span>
    <span class="chip-meta" *ngIf="summary">· {{ summary.channels }}ch / {{ summary.events }}ev</span>
  </div>

  <!-- mentés felhőbe -->
  <div class="save-section" *ngIf="summary && !error">
    <label class="hbtn save-toggle" [class.active]="saveToCloud" title="Save to cloud">
      <input type="checkbox" [(ngModel)]="saveToCloud" hidden />
      ☁ Save
    </label>
    <div class="save-popover" *ngIf="saveToCloud">
      <div class="save-popover-label">Save to cloud</div>
      <input class="save-input" type="text" placeholder="Trace name"
             [(ngModel)]="traceName" />
      <div class="save-row">
        <button class="hbtn save-btn"
                [disabled]="!canSave || saveStatus === 'saving'"
                (click)="saveCurrentTrace()">
          {{ saveStatus === 'saving' ? 'Saving…' : 'Save' }}
        </button>
        <span class="save-status-ok" *ngIf="saveStatus === 'saved'">Saved!</span>
        <span class="save-status-err" *ngIf="saveStatus === 'error'" [title]="saveError">Error</span>
      </div>
    </div>
  </div>

  <!-- hibaüzenet -->
  <div class="upload-error" *ngIf="error" [title]="error">⚠ {{ error }}</div>

  <!-- mentett trace-ek listája -->
  <div class="cloud-modal" *ngIf="showCloudList">
    <div class="cloud-modal-inner">
      <div class="cloud-modal-header">
        <span>Cloud traces</span>
        <button class="btn-icon" (click)="closeCloudList()">✕</button>
      </div>
      <div class="cloud-modal-body">
        <div *ngIf="cloudLoading" class="cloud-loading">Loading…</div>
        <div *ngIf="cloudError" class="cloud-err">{{ cloudError }}</div>
        <div *ngIf="!cloudLoading && !cloudError && cloudTraces.length === 0" class="cloud-empty">
          No saved traces yet.
        </div>
        <ul class="cloud-list" *ngIf="!cloudLoading && cloudTraces.length > 0">
          <li *ngFor="let t of cloudTraces" (click)="loadCloudTrace(t)" class="cloud-item">
            <span class="cloud-name">{{ t.filename }}</span>
            <span class="cloud-date" *ngIf="t.createdAt">
              {{ t.createdAt.toDate() | date:'yyyy-MM-dd HH:mm' }}
            </span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
